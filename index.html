<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D-HANDS</title>
<meta name="description" content="Attach any file — image, GIF, video or anything else — it appears between the hands and spins in 3D. Download as MP4 or GIF, from 144p up to 4K.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <main>
    <header>
      <h1>3D-HANDS</h1>
      <p>Attach any file — image, GIF, video or anything else — it appears between the hands and spins in 3D.</p>
    </header>

    <div class="stage" id="stage">
      <div class="drop-hint">Drop to attach</div>
      <button class="sound" id="sound" hidden aria-label="Toggle sound">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
      </button>
      <div class="busy" id="busy">
        <div class="label" id="busyLabel">Rendering…</div>
        <div class="bar"><i id="barFill"></i></div>
      </div>
    </div>

    <div class="controls">
      <div class="row">
        <label class="btn btn-main">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Attach media
          <input type="file" id="file">
        </label>
        <label class="btn select" title="Quality for preview, MP4 and GIF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15V9m0 3h3m0-3v6M14 9h1.5a3 3 0 0 1 0 6H14V9z"/></svg>
          <select id="quality" aria-label="Quality">
            <option value="144">144p</option>
            <option value="240">240p</option>
            <option value="360">360p</option>
            <option value="480">480p</option>
            <option value="720">720p</option>
            <option value="1080" selected>1080p</option>
            <option value="1440">1440p</option>
            <option value="2160">4K</option>
          </select>
        </label>
      </div>
      <div class="downloads" id="downloads">
        <button class="btn" id="dlMp4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>MP4 <span data-q>1080p</span></button>
        <button class="btn" id="dlGif"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>GIF <span data-q>1080p</span></button>
      </div>
      <div class="note" id="note"></div>
    </div>
  </main>

  <script src="js/stars.js"></script>
  <script src="js/hands.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
